<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18181b">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <title>GerTwinsApp — Фитнес Дневник</title>
    <style>
        :root {
            --bg-dark: #121215;
            --bg-card: #1c1c21;
            --bg-input: #26262d;
            --border: #32323c;
            --orange: #f97316;
            --orange-hover: #ea580c;
            --text: #f4f4f5;
            --muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-dark); color: var(--text); padding-bottom: 80px; }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-dark); }
        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(28, 28, 33, 0.95); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand img { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(249,115,22,0.5); }
        .brand h1 { font-size: 18px; font-weight: 800; }
        .brand h1 span { color: var(--orange); }
        .brand p { font-size: 11px; color: var(--muted); }
        .timer-pill {
            background: rgba(249,115,22,0.15); border: 1px solid var(--orange);
            color: var(--orange); padding: 4px 10px; border-radius: 20px;
            font-weight: 700; font-size: 13px; cursor: pointer;
        }
        main { padding: 16px; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; margin-bottom: 16px;
        }
        .card h2 { font-size: 16px; color: var(--orange); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        input, select {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text); padding: 10px 12px; border-radius: 10px;
            font-size: 14px; margin-bottom: 10px; outline: none;
        }
        input:focus, select:focus { border-color: var(--orange); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn {
            width: 100%; background: var(--orange); color: #fff; border: none;
            padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px;
            cursor: pointer; transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); background: var(--orange-hover); }
        .btn-outline {
            background: var(--bg-input); color: var(--orange);
            border: 1px solid rgba(249,115,22,0.4);
        }
        .btn-sm { padding: 8px; font-size: 12px; }
        .item-row {
            background: var(--bg-input); padding: 10px 12px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 13px;
        }
        .badge { background: rgba(249,115,22,0.2); color: var(--orange); padding: 3px 8px; border-radius: 8px; font-weight: 700; font-size: 12px; }
        .progress-bar { width: 100%; height: 10px; background: var(--bg-input); border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: var(--orange); transition: width 0.3s; }
        nav {
            position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
            background: var(--bg-card); border-top: 1px solid var(--border);
            display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 4px; z-index: 50;
        }
        .nav-btn {
            background: none; border: none; color: var(--muted);
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            font-size: 10px; cursor: pointer;
        }
        .nav-btn.active { color: var(--orange); font-weight: 700; }
        .nav-btn span.ico { font-size: 18px; }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .photo-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
        .hidden { display: none; }
    </style>
</head>

        <!-- 1. ТРЕНИРОВКИ И ПЛАН -->
        <section id="tab-workouts">
            <div class="card">
                <h2>Новая тренировка</h2>
                <input id="wName" placeholder="Название (напр. Грудь + Трицепс)">
                <select id="exPreset" onchange="document.getElementById('exName').value=this.value">
                    <option value="">-- Выбрать из библиотеки --</option>
                    <option value="Жим штанги лёжа">🏋️ Жим штанги лёжа (Грудь)</option>
                    <option value="Приседания со штангой">🦵 Приседания со штангой (Ноги)</option>
                    <option value="Становая тяга">🔥 Становая тяга (Спина)</option>
                    <option value="Подтягивания">💪 Подтягивания (Спина)</option>
                    <option value="Жим гантелей сидя">⚡ Жим гантелей сидя (Плечи)</option>
                    <option value="Подъём на бицепс">🦾 Подъём на бицепс (Руки)</option>
                </select>
                <input id="exName" placeholder="Или введите своё упражнение">
                <div class="grid-3">
                    <input id="exSets" type="number" placeholder="Подходы">
                    <input id="exReps" type="number" placeholder="Повторы">
                    <input id="exWeight" type="number" placeholder="Вес (кг)">
                </div>
                <button class="btn btn-outline btn-sm" onclick="addExercise()">+ Добавить упражнение</button>
                <div id="currentExList" style="margin-top:10px;"></div>
                <button class="btn" style="margin-top:10px;" onclick="saveWorkout()">Сохранить тренировку</button>
            </div>

            <div class="card">
                <h2>Таймер отдыха</h2>
                <div class="grid-3">
                    <button class="btn btn-outline btn-sm" onclick="startTimer(60)">1:00</button>
                    <button class="btn btn-outline btn-sm" onclick="startTimer(90)">1:30</button>
                    <button class="btn btn-outline btn-sm" onclick="startTimer(120)">2:00</button>
                </div>
            </div>

            <div class="card">
                <h2>План тренировок на неделю</h2>
                <div class="grid-2">
                    <select id="planDay">
                        <option>Понедельник</option><option>Вторник</option><option>Среда</option>
                        <option>Четверг</option><option>Пятница</option><option>Суббота</option><option>Воскресенье</option>
                    </select>
                    <input id="planText" placeholder="Программа дня">
                </div>
                <button class="btn btn-outline btn-sm" onclick="addPlan()">Добавить в расписание</button>
                <div id="planList" style="margin-top:10px;"></div>
            </div>

            <div class="card">
                <h2>История тренировок</h2>
                <div id="workoutHistory"></div>
            </div>
        </section>

        <!-- 2. ПИТАНИЕ, БЖУ И ВОДА -->
        <section id="tab-nutrition" class="hidden">
            <div class="card">
                <h2>Питание и БЖУ <span id="calBadge" class="badge">0 ккал</span></h2>
                <div id="macroSummary" style="font-size:12px; color:var(--muted); margin-bottom:10px;">Б: 0г | Ж: 0г | У: 0г</div>
                <select id="mealType">
                    <option value="Завтрак">🍳 Завтрак</option>
                    <option value="Обед">🍲 Обед</option>
                    <option value="Ужин">🥗 Ужин</option>
                    <option value="Перекус">🥜 Перекус</option>
                </select>
                <input id="foodName" placeholder="Продукт (напр. Куриная грудка 200г)">
                <div class="grid-2">
                    <input id="foodCal" type="number" placeholder="Калории (ккал)">
                    <input id="foodP" type="number" placeholder="Белки (г)">
                </div>
                <div class="grid-2">
                    <input id="foodF" type="number" placeholder="Жиры (г)">
                    <input id="foodC" type="number" placeholder="Углеводы (г)">
                </div>
                <button class="btn" onclick="addFood()">Добавить в дневник</button>
                <div id="foodList" style="margin-top:12px;"></div>
            </div>

            <div class="card">
                <h2>Учёт воды <span id="waterBadge" class="badge">0 / 2500 мл</span></h2>
                <div class="progress-bar"><div id="waterFill" class="progress-fill" style="width:0%"></div></div>
                <div class="grid-3">
                    <button class="btn btn-outline btn-sm" onclick="addWater(250)">+250 мл</button>
                    <button class="btn btn-outline btn-sm" onclick="addWater(500)">+500 мл</button>
                    <button class="btn btn-outline btn-sm" onclick="resetWater()">Сброс</button>

            </div>

                <div class="grid-2">
                    <input id="bWeight" type="number" step="0.1" placeholder="Вес (кг)">
                    <input id="bChest" type="number" placeholder="Грудь (см)">
                </div>
                <div class="grid-2">
                    <input id="bWaist" type="number" placeholder="Талия (см)">
                    <input id="bHips" type="number" placeholder="Бёдра (см)">
                </div>
                <div class="grid-2">
                    <input id="bArms" type="number" placeholder="Руки (см)">
                    <input id="bLegs" type="number" placeholder="Ноги (см)">

<script>
    let state = JSON.parse(localStorage.getItem('gertwins_v2')) || {
        workouts: [], plan: [], food: [], water: 0, body: [], photos: [],
        goals: { weight: 80, water: 2500 }
    };
    let tempExercises = [];
    let timerInt = null;

    function saveState() {
        localStorage.setItem('gertwins_v2', JSON.stringify(state));
        renderAll();
    }

    function switchTab(tab, btn) {
        document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
        document.getElementById('tab-' + tab).classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function startTimer(sec) {
        clearInterval(timerInt);
        const box = document.getElementById('timerBox');
        const txt = document.getElementById('timerText');
        box.classList.remove('hidden');
        let left = sec;
        const upd = () => {
            txt.textContent = String(Math.floor(left/60)).padStart(2,'0') + ':' + String(left%60).padStart(2,'0');
            if (left <= 0) { clearInterval(timerInt); box.classList.add('hidden'); }
            left--;
        };
        upd();
        timerInt = setInterval(upd, 1000);
    }
    function stopTimer() { clearInterval(timerInt); document.getElementById('timerBox').classList.add('hidden'); }

    function addExercise() {
        const name = document.getElementById('exName').value.trim();
        if (!name) return;
        tempExercises.push({
            name,
            sets: document.getElementById('exSets').value || 3,
            reps: document.getElementById('exReps').value || 10,
            weight: document.getElementById('exWeight').value || 0
        });
        document.getElementById('exName').value = '';
        renderTempEx();
    }
    function renderTempEx() {
        document.getElementById('currentExList').innerHTML = tempExercises.map(e =>
            `<div class="item-row"><span>${e.name}</span><span class="badge">${e.sets}×${e.reps} • ${e.weight}кг</span></div>`
        ).join('');
    }
    function saveWorkout() {
        const name = document.getElementById('wName').value.trim() || 'Тренировка';
        if (!tempExercises.length) return;
        state.workouts.unshift({ date: new Date().toLocaleDateString('ru-RU'), name, exercises: [...tempExercises] });
        tempExercises = [];
        document.getElementById('wName').value = '';
        renderTempEx();
        saveState();
    }

    function addPlan() {
        const day = document.getElementById('planDay').value;
        const text = document.getElementById('planText').value.trim();
        if (!text) return;
        state.plan.push({ day, text });
        document.getElementById('planText').value = '';
        saveState();
    }

    function addFood() {
        const name = document.getElementById('foodName').value.trim();
        const cal = Number(document.getElementById('foodCal').value) || 0;
        if (!name) return;
        state.food.unshift({
            meal: document.getElementById('mealType').value,
            name, cal,
            p: Number(document.getElementById('foodP').value) || 0,
            f: Number(document.getElementById('foodF').value) || 0,
            c: Number(document.getElementById('foodC').value) || 0
        });
        ['foodName','foodCal','foodP','foodF','foodC'].forEach(id => document.getElementById(id).value = '');
        saveState();
    }

    function addWater(ml) { state.water += ml; saveState(); }
    function resetWater() { state.water = 0; saveState(); }

    function saveBody() {
        const w = document.getElementById('bWeight').value;
        if (!w) return;
        state.body.unshift({
            date: new Date().toLocaleDateString('ru-RU'),
            weight: w,
            chest: document.getElementById('bChest').value || '-',
            waist: document.getElementById('bWaist').value || '-',
            hips: document.getElementById('bHips').value || '-',
            arms: document.getElementById('bArms').value || '-',
            legs: document.getElementById('bLegs').value || '-'
        });
        ['bWeight','bChest','bWaist','bHips','bArms','bLegs'].forEach(id => document.getElementById(id).value = '');
        saveState();
    }

    function uploadPhoto(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            state.photos.unshift({ date: new Date().toLocaleDateString('ru-RU'), src: ev.target.result });
            saveState();
        };
        reader.readAsDataURL(file);
    }

    function saveGoals() {
        state.goals.weight = Number(document.getElementById('goalWeight').value) || 80;
        state.goals.water = Number(document.getElementById('goalWater').value) || 2500;
        saveState();
        alert('Цели сохранены!');
    }

    function exportBackup() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'GerTwinsApp-backup.json';
        a.click();
    }

    function renderAll() {
        document.getElementById('workoutHistory').innerHTML = state.workouts.map(w =>
            `<div class="item-row" style="flex-direction:column; align-items:flex-start;">
                <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:4px;">
                    <strong>${w.name}</strong><span style="color:var(--muted)">${w.date}</span>
                </div>
                <div style="font-size:12px; color:var(--orange)">${w.exercises.map(e => `${e.name} (${e.sets}×${e.reps} ${e.weight}кг)`).join(', ')}</div>
            </div>`
        ).join('') || '<p style="font-size:12px;color:var(--muted)">Пока нет тренировок</p>';

        document.getElementById('planList').innerHTML = state.plan.map(p =>
            `<div class="item-row"><strong>${p.day}</strong><span>${p.text}</span></div>`
        ).join('');

        let cal = 0, p = 0, f = 0, c = 0;
        state.food.forEach(x => { cal += x.cal; p += x.p; f += x.f; c += x.c; });
        document.getElementById('calBadge').textContent = cal + ' ккал';
        document.getElementById('macroSummary').textContent = `Б: ${p}г | Ж: ${f}г | У: ${c}г`;
        document.getElementById('foodList').innerHTML = state.food.map(x =>
            `<div class="item-row"><span>[${x.meal}] ${x.name}</span><span class="badge">${x.cal} ккал</span></div>`
        ).join('');

        const wGoal = state.goals.water || 2500;
        document.getElementById('waterBadge').textContent = `${state.water} / ${wGoal} мл`;
        document.getElementById('waterFill').style.width = Math.min(100, (state.water / wGoal) * 100) + '%';

        document.getElementById('bodyList').innerHTML = state.body.map(b =>
            `<div class="item-row" style="flex-direction:column; align-items:flex-start;">
                <div style="width:100%; display:flex; justify-content:space-between;">
                    <strong>${b.weight} кг</strong><span style="color:var(--muted)">${b.date}</span>
                </div>
                <div style="font-size:11px; color:var(--muted); margin-top:4px;">Грудь: ${b.chest} | Талия: ${b.waist} | Бёдра: ${b.hips} | Руки: ${b.arms} | Ноги: ${b.legs}</div>
            </div>`
        ).join('');

        document.getElementById('photoGrid').innerHTML = state.photos.map(ph =>
            `<div class="photo-card"><img src="${ph.src}"><div style="font-size:11px;color:var(--muted);text-align:center;">${ph.date}</div></div>`
        ).join('');

        document.getElementById('statsSummary').innerHTML = `
            <div class="item-row"><span>Всего тренировок</span><span class="badge">${state.workouts.length}</span></div>
            <div class="item-row"><span>Текущий вес / Цель</span><span class="badge">${state.body[0]?.weight || '-'} / ${state.goals.weight} кг</span></div>
        `;

        document.getElementById('achievementsList').innerHTML = `
            <div class="item-row"><span>🏅 Первая тренировка</span><span class="badge">${state.workouts.length >= 1 ? 'Получено' : 'В процессе'}</span></div>
            <div class="item-row"><span>🔥 5 тренировок</span><span class="badge">${state.workouts.length >= 5 ? 'Получено' : state.workouts.length + '/5'}</span></div>
            <div class="item-row"><span>💧 Водный баланс</span><span class="badge">${state.water >= wGoal ? 'Выполнено' : 'В процессе'}</span></div>
        `;
    }
    renderAll();
</script>
</body>
</html>
